apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: realworld
  namespace: realworld

spec:

  ingressClassName: nginx

  rules:

  - host: realworld.local

    http:

      paths:

      - path: /
        pathType: Prefix

        backend:
          service:
            name: frontend
            port:
              number: 80


      - path: /api
        pathType: Prefix

        backend:
          service:
            name: backend
            port:
              number: 3000