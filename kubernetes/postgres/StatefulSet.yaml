apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  namespace: realworld

spec:

  serviceName: postgres

  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:

      - name: postgres

        image: postgres:16-alpine

        ports:
          - containerPort: 5432

        envFrom:
          - secretRef:
              name: postgres-secret

        volumeMounts:
          - name: postgres-storage
            mountPath: /var/lib/postgresql/data
            subPath: postgres

  volumeClaimTemplates:

  - metadata:
      name: postgres-storage

    spec:

      storageClassName: gp3
      accessModes:
        - ReadWriteOnce

      resources:
        requests:
          storage: 5Gi