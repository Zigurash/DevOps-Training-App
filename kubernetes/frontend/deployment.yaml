apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: realworld

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      imagePullSecrets:
        - name: ghcr-secret
        
      containers:

      - name: frontend

        image: ghcr.io/zigurash/realworld-frontend:v1

        ports:
        - containerPort: 80